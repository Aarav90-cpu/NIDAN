name: Build and Release NIDAN OS

on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate build tag
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Run NIDAN build script
        working-directory: NIDAN/OS
        run: |
          chmod +x ./build
          sudo ./build

      - name: Locate custom ISO file
        id: locate_iso
        working-directory: NIDAN/OS
        run: |
          ISO_PATH=$(ls *.iso | head -n 1)
          if [ -z "$ISO_PATH" ]; then
            echo "Error: No ISO file found after build!"
            exit 1
          fi
          echo "Found ISO: $ISO_PATH"
          echo "iso_file=NIDAN/OS/$ISO_PATH" >> $GITHUB_OUTPUT

      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prerelease-${{ steps.vars.outputs.sha_short }}
          name: NIDAN OS Build (${{ steps.vars.outputs.sha_short }})
          body: |
            Automated pre-release build for NIDAN custom distribution.
            Built from commit: ${{ github.sha }}
          draft: false
          prerelease: true
          files: |
            ${{ steps.locate_iso.outputs.iso_file }}
