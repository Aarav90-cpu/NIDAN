name: Build and Release NIDAN OS

on:
  push:
    branches:
      - main

jobs:
  build-app:
    name: Build NIDAN Swift Application and Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Swift and Dependencies
        uses: actions/cache@v4
        with:
          path: |
            .build
            mimalloc
            sqlite
          key: ${{ runner.os }}-swift-mimalloc-v3-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swift-mimalloc-v3-

      - name: Build NIDAN Swift App
        run: |
          echo "Compiling NidanApp natively for x86_64 with Musl and Mimalloc..."
          docker run --rm -v "$(pwd)":/workspace -w /workspace swift:6.0.1 bash -c "\
            apt-get update && apt-get install -y musl-tools cmake git curl unzip && \
            if [ ! -d 'mimalloc/build' ]; then \
              git clone --depth 1 https://github.com/microsoft/mimalloc.git && \
              cd mimalloc && mkdir build && cd build && \
              CC=musl-gcc cmake .. -DMI_BUILD_SHARED=OFF -DMI_BUILD_STATIC=ON && \
              make && cd ../..; \
            fi && \
            if [ ! -d 'sqlite/build' ]; then \
              mkdir -p sqlite/build && cd sqlite/build && \
              curl -LO https://sqlite.org/2024/sqlite-amalgamation-3450300.zip && \
              unzip sqlite-amalgamation-3450300.zip && \
              cd sqlite-amalgamation-3450300 && \
              musl-gcc -O3 -DSQLITE_ENABLE_SNAPSHOT=1 -DSQLITE_ENABLE_FTS5=1 -DSQLITE_ENABLE_PREUPDATE_HOOK=1 -DSQLITE_ENABLE_SESSION=1 -DSQLITE_ENABLE_RTREE=1 -DSQLITE_ENABLE_MATH_FUNCTIONS=1 -c sqlite3.c && \
              ar rcs libsqlite3.a sqlite3.o && cd ../../..; \
            fi && \
            curl -LO https://download.swift.org/swift-6.0.1-release/static-sdk/swift-6.0.1-RELEASE/swift-6.0.1-RELEASE_static-linux-0.0.1.artifactbundle.tar.gz && \
            swift sdk install swift-6.0.1-RELEASE_static-linux-0.0.1.artifactbundle.tar.gz && \
            swift build -c release --product NidanApp --swift-sdk x86_64-swift-linux-musl \
              -Xswiftc -static-executable \
              -Xcc -I\$(pwd)/sqlite/build/sqlite-amalgamation-3450300 \
              -Xlinker -L\$(pwd)/sqlite/build/sqlite-amalgamation-3450300 \
              -Xlinker -lsqlite3 \
              -Xlinker -L\$(pwd)/mimalloc/build \
              -Xlinker -lmimalloc"
          cp .build/x86_64-swift-linux-musl/release/NidanApp NidanApp-x86_64

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Web Frontend
        run: |
          cd Frontend
          npm install
          npm run build

      - name: Upload NidanApp artifact
        uses: actions/upload-artifact@v4
        with:
          name: nidan-app-x86_64
          path: NidanApp-x86_64
          if-no-files-found: error

      - name: Upload Frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: nidan-frontend-dist
          path: Frontend/dist
          if-no-files-found: error

  build-iso:
    name: Build NIDAN Alpine Linux ISO
    needs: build-app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download compiled NidanApp
        uses: actions/download-artifact@v4
        with:
          name: nidan-app-x86_64
          path: OS/bin

      - name: Download compiled Frontend
        uses: actions/download-artifact@v4
        with:
          name: nidan-frontend-dist
          path: OS/www

      - name: Prepare executable
        run: |
          mv OS/bin/NidanApp-x86_64 OS/bin/nidan
          chmod +x OS/bin/nidan

      - name: Build Alpine ISO
        run: |
          cd OS
          ./build.sh

      - name: Locate ISO file
        id: locate_iso
        run: |
          ISO_PATH=$(ls OS/output/*.iso | head -n 1)
          if [ -z "$ISO_PATH" ]; then
            echo "Error: No ISO file found in OS/output!"
            exit 1
          fi
          SHA_SHORT=$(git rev-parse --short HEAD)
          FINAL_ISO="nidan-os-${SHA_SHORT}-x86_64.iso"
          cp "$ISO_PATH" "OS/output/$FINAL_ISO"
          echo "iso_file=OS/output/$FINAL_ISO" >> $GITHUB_OUTPUT
          echo "sha_short=$SHA_SHORT" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prerelease-${{ steps.locate_iso.outputs.sha_short }}
          name: NIDAN OS Build (${{ steps.locate_iso.outputs.sha_short }})
          body: |
            Automated build for NIDAN custom Alpine Linux distribution with kiosk UI.
            Compiled natively on x86_64 architecture.
            Commit: ${{ github.sha }}
          draft: false
          prerelease: true
          files: |
            ${{ steps.locate_iso.outputs.iso_file }}
            OS/bin/nidan
