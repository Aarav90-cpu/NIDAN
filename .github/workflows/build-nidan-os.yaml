name: Build and Release NIDAN OS

on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate build tag
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build NIDAN Engine and Compile ISO
        run: |
          # Navigate to the correct directory structure
          cd OS/
          
          export DOCKER_BUILDKIT=1
          
          echo "Step 1: Building/Verifying the NIDAN Build Engine..."
          docker build -t nidan-builder .
          
          echo "Step 2: Checking configuration engine layout..."
          if [ ! -d "config" ]; then
              echo "Initializing fresh live-build layout..."
              docker run --privileged --rm -v "$(pwd)":/workspace nidan-builder lb config
          fi
          
          echo "Step 3: Compiling your NIDAN custom ISO..."
          docker run --privileged --rm -v "$(pwd)":/workspace nidan-builder sh -c "lb clean --purge && lb build"
          
          echo "Success! Your custom NIDAN distribution ISO is ready."

      - name: Locate custom ISO file
        id: locate_iso
        run: |
          cd OS/
          ISO_PATH=$(ls *.iso | head -n 1)
          if [ -z "$ISO_PATH" ]; then
            echo "Error: No ISO file found after build!"
            exit 1
          fi
          echo "Found ISO: $ISO_PATH"
          echo "iso_file=OS/$ISO_PATH" >> $GITHUB_OUTPUT

      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prerelease-${{ steps.vars.outputs.sha_short }}
          name: NIDAN OS Build (${{ steps.vars.outputs.sha_short }})
          body: |
            Automated pre-release build for NIDAN custom distribution.
            Built from commit: ${{ github.sha }}
          draft: false
          prerelease: true
          files: |
            ${{ steps.locate_iso.outputs.iso_file }}
