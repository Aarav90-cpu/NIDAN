name: Build and Release NIDAN OS

on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    # Running on an ARM64 runner machine
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Sets up QEMU multi-architecture emulation on the host kernel
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate build tag
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build NIDAN Engine and Compile ISO
        run: |
          cd OS/
          export DOCKER_BUILDKIT=1
          
          echo "Step 1: Building/Verifying the NIDAN Build Engine for x86_64..."
          # Build the Docker build environment targeting x86_64 explicitly
          docker build --platform linux/amd64 -t nidan-builder .
          
          echo "Step 2: Purging old runtime artifacts..."
          docker run --privileged --rm --platform linux/amd64 -v "$(pwd)":/workspace nidan-builder lb clean --purge
          
          echo "Step 3: Initializing live-build layout targeting 64-bit..."
          # --architectures amd64 tells live-build to configure an x86_64 OS
          docker run --privileged --rm --platform linux/amd64 -v "$(pwd)":/workspace nidan-builder lb config \
            --architectures amd64 \
            --image-name nidan-x86_64
          
          echo "Step 4: Compiling your NIDAN custom ISO via emulation..."
          docker run --privileged --rm --platform linux/amd64 -v "$(pwd)":/workspace nidan-builder lb build
          
          echo "Success! Your custom NIDAN distribution ISO is ready."

      - name: Locate and Rename ISO file
        id: locate_iso
        run: |
          cd OS/
          GEN_ISO=$(ls *.iso | head -n 1)
          if [ -z "$GEN_ISO" ]; then
            echo "Error: No ISO file found after build!"
            exit 1
          fi
          
          FINAL_ISO="nidan-os-${{ steps.vars.outputs.sha_short }}-x86_64.iso"
          mv "$GEN_ISO" "$FINAL_ISO"
          
          echo "Standardized ISO Name: $FINAL_ISO"
          echo "iso_file=OS/$FINAL_ISO" >> $GITHUB_OUTPUT

      - name: Build NIDAN Swift App
        run: |
          echo "Compiling NidanApp for x86_64..."
          docker run --rm --platform linux/amd64 -v "$(pwd)":/workspace -w /workspace swift:6.0 bash -c "swift build -c release"
          cp .build/release/NidanApp NidanApp-x86_64

      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prerelease-${{ steps.vars.outputs.sha_short }}
          name: NIDAN OS Build (${{ steps.vars.outputs.sha_short }})
          body: |
            Automated pre-release build for NIDAN custom x86_64 distribution.
            Built on ARM64 infrastructure using emulation.
            Built from commit: ${{ github.sha }}
          draft: false
          prerelease: true
          files: |
            ${{ steps.locate_iso.outputs.iso_file }}
            NidanApp-x86_64
