name: Build and Release NIDAN OS

on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    # Running on an ARM runner machine
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Sets up QEMU multi-architecture emulation on the host kernel
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate build tag
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Cache live-build OS cache
        uses: actions/cache@v4
        with:
          path: OS/cache
          key: ${{ runner.os }}-live-build-${{ hashFiles('OS/config/package-lists/**') }}
          restore-keys: |
            ${{ runner.os }}-live-build-

      - name: Cache Swift and Mimalloc
        uses: actions/cache@v4
        with:
          path: |
            .build
            mimalloc
            sqlite
          key: ${{ runner.os }}-swift-mimalloc-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swift-mimalloc-

      - name: Build NIDAN Swift App
        run: |
          echo "Compiling NidanApp for x86_64 with Musl and Mimalloc..."
          docker run --rm --platform linux/amd64 -v "$(pwd)":/workspace -w /workspace swift:6.0.1 bash -c "\
            apt-get update && apt-get install -y musl-tools cmake git curl unzip && \
            if [ ! -d 'mimalloc/build' ]; then \
              git clone --depth 1 https://github.com/microsoft/mimalloc.git && \
              cd mimalloc && mkdir build && cd build && \
              CC=musl-gcc cmake .. -DMI_BUILD_SHARED=OFF -DMI_BUILD_STATIC=ON && \
              make -j\$(nproc) && cd ../..; \
            else \
              echo 'Mimalloc already built, skipping...'; \
            fi && \
            if [ ! -d 'sqlite/build' ]; then \
              mkdir -p sqlite/build && cd sqlite/build && \
              curl -LO https://sqlite.org/2024/sqlite-amalgamation-3450300.zip && \
              unzip sqlite-amalgamation-3450300.zip && \
              cd sqlite-amalgamation-3450300 && \
              musl-gcc -O3 -c sqlite3.c && \
              ar rcs libsqlite3.a sqlite3.o && cd ../../..; \
            else \
              echo 'SQLite already built, skipping...'; \
            fi && \
            curl -LO https://download.swift.org/swift-6.0.1-release/static-sdk/swift-6.0.1-RELEASE/swift-6.0.1-RELEASE_static-linux-0.0.1.artifactbundle.tar.gz && \
            swift sdk install swift-6.0.1-RELEASE_static-linux-0.0.1.artifactbundle.tar.gz && \
            swift build -c release --product NidanApp --swift-sdk x86_64-swift-linux-musl \
              -Xswiftc -static-executable \
              -Xcc -I\$(pwd)/sqlite/build/sqlite-amalgamation-3450300 \
              -Xlinker -L\$(pwd)/sqlite/build/sqlite-amalgamation-3450300 \
              -Xlinker -lsqlite3 \
              -Xlinker -L\$(pwd)/mimalloc/build \
              -Xlinker -lmimalloc"
          cp .build/x86_64-swift-linux-musl/release/NidanApp NidanApp-x86_64
          # Move into the live-build chroot includes so it becomes part of the OS
          mkdir -p OS/config/includes.chroot/usr/local/bin
          cp NidanApp-x86_64 OS/config/includes.chroot/usr/local/bin/nidan
          chmod +x OS/config/includes.chroot/usr/local/bin/nidan

      - name: Build NIDAN Engine and Compile ISO
        run: |
          cd OS/
          export DOCKER_BUILDKIT=1
          
          echo "Step 1: Building/Verifying the NIDAN Build Engine for x86_64..."
          # Build the Docker build environment targeting x86_64 explicitly
          docker build --platform linux/amd64 -t nidan-builder .
          
          echo "Step 2: Purging old runtime artifacts..."
          docker run --privileged --rm --platform linux/amd64 -v "$(pwd)":/workspace nidan-builder lb clean --purge
          
          echo "Step 3: Initializing live-build layout targeting 64-bit..."
          # --architectures amd64 tells live-build to configure an x86_64 OS
          docker run --privileged --rm --platform linux/amd64 -v "$(pwd)":/workspace nidan-builder lb config \
            --architectures amd64 \
            --image-name nidan-x86_64 \
            --bootappend-live "boot=live components quiet splash loglevel=0 fastboot noautologin console=tty1"
          
          echo "Step 4: Compiling your NIDAN custom ISO via emulation..."
          docker run --privileged --rm --platform linux/amd64 -v "$(pwd)":/workspace nidan-builder lb build
          
          echo "Success! Your custom NIDAN distribution ISO is ready."

      - name: Locate and Rename ISO file
        id: locate_iso
        run: |
          cd OS/
          GEN_ISO=$(ls *.iso | head -n 1)
          if [ -z "$GEN_ISO" ]; then
            echo "Error: No ISO file found after build!"
            exit 1
          fi
          
          FINAL_ISO="nidan-os-${{ steps.vars.outputs.sha_short }}-x86_64.iso"
          mv "$GEN_ISO" "$FINAL_ISO"
          
          echo "Standardized ISO Name: $FINAL_ISO"
          echo "iso_file=OS/$FINAL_ISO" >> $GITHUB_OUTPUT

      - name: Create GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prerelease-${{ steps.vars.outputs.sha_short }}
          name: NIDAN OS Build (${{ steps.vars.outputs.sha_short }})
          body: |
            Automated pre-release build for NIDAN custom x86_64 distribution.
            Built on ARM64 infrastructure using emulation.
            Built from commit: ${{ github.sha }}
          draft: false
          prerelease: true
          files: |
            ${{ steps.locate_iso.outputs.iso_file }}
            NidanApp-x86_64

      - name: Fix permissions for Cache
        if: always()
        run: sudo chown -R $USER:$USER OS/cache .build mimalloc sqlite || true
