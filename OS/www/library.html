<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>NIDAN Library</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>.search-bar{background:var(--surface);border:1px solid var(--card-border);border-radius:24px;flex:1;align-items:center;gap:.5rem;max-width:400px;padding:0 1rem;display:flex}.search-bar input{background:0 0;border:none;outline:none;flex:1;padding:.75rem 0;font-family:inherit;font-size:1rem}.library-grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1.5rem;margin-top:1.5rem;display:grid}.resource-card{background:var(--surface);border:1px solid var(--card-border);border-radius:12px;flex-direction:column;transition:transform .2s,box-shadow .2s;display:flex;overflow:hidden}.resource-card:hover{box-shadow:var(--card-shadow-hover);transform:translateY(-4px)}.resource-preview{height:120px;color:var(--text-secondary);background:#0000000d;justify-content:center;align-items:center;display:flex}.resource-preview .material-symbols-outlined{font-size:4rem}.resource-info{flex:1;padding:1rem}.resource-title{margin:0 0 .25rem;font-size:1.1rem;font-weight:500}.resource-meta{color:var(--text-secondary);margin:0;font-size:.9rem}.resource-actions{border-top:1px solid var(--card-border);justify-content:flex-end;gap:.5rem;padding:.5rem;display:flex}.bookmarked{color:#fbc02d}</style>
