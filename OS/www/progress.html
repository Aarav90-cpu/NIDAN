<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NIDAN Progress</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
    <style>.progress-list{flex-direction:column;gap:1.5rem;display:flex}.progress-item{background:var(--surface);border:1px solid var(--card-border);border-radius:12px;padding:1.5rem}.progress-header{justify-content:space-between;align-items:center;margin-bottom:.5rem;display:flex}.progress-title{margin:0;font-size:1.25rem;font-weight:500}.progress-stats{color:var(--text-primary);align-items:center;gap:.5rem;font-size:1.1rem;font-weight:500;display:flex}</style>
    <script type="module" crossorigin src="/assets/progress-1sUtjQEE.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/icon-BclkLKie.js">
    <link rel="modulepreload" crossorigin href="/assets/icon-button-DCxda_7H.js">
    <link rel="stylesheet" crossorigin href="/assets/icon-06tX8z_E.css">
  </head>
  <body class="light-theme">
    <div id="app">
      <header class="top-bar">
        <div class="greeting" style="display: flex; align-items: center; gap: 1rem;">
          <md-icon-button onclick="window.location.href='/'">
            <span class="material-symbols-outlined">arrow_back</span>
          </md-icon-button>
          <div>
            <h1>Your Progress</h1>
            <p>Marks recorded by your school</p>
          </div>
        </div>
      </header>

      <main class="dashboard-grid" style="grid-template-columns: 1fr; max-width: 800px; margin: 2rem auto;">
        <section class="card">
          <div class="card-header">
            <h2>Recorded Assessments</h2>
            <md-icon style="color: var(--primary);">trending_up</md-icon>
          </div>
          <div class="card-body progress-list" id="progress-list">
            <!-- Populated by JS -->
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
