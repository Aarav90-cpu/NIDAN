<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NIDAN Roadmap</title>
    <link rel="stylesheet" crossorigin href="./assets/fonts.css">
    <style>.timeline{margin-top:2rem;padding-left:2rem;position:relative}.timeline:before{content:"";background:var(--card-border);width:2px;position:absolute;top:0;bottom:0;left:11px}.timeline-node{margin-bottom:2rem;position:relative}.timeline-dot{background:var(--surface);border:4px solid var(--primary);z-index:1;border-radius:50%;width:16px;height:16px;position:absolute;top:4px;left:-2rem}.timeline-dot.completed{background:var(--primary)}.timeline-dot.current{background:#fff;box-shadow:0 0 0 4px #0060a833}.timeline-dot.future{border-color:var(--text-secondary);background:var(--surface)}.timeline-content{background:var(--surface);border:1px solid var(--card-border);box-shadow:var(--card-shadow);border-radius:12px;padding:1.5rem}.timeline-content h3{align-items:center;gap:.5rem;margin:0 0 .5rem;font-size:1.2rem;font-weight:500;display:flex}.timeline-content p{color:var(--text-secondary);margin:0;line-height:1.5}.node-completed .timeline-content h3{color:#2e7d32}.node-current .timeline-content h3{color:var(--primary)}.node-future .timeline-content h3{color:var(--text-secondary)}</style>
    <script type="module" crossorigin src="./assets/roadmap-17KK1aZJ.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/icon-BclkLKie.js">
    <link rel="modulepreload" crossorigin href="./assets/icon-button-DCxda_7H.js">
    <link rel="stylesheet" crossorigin href="./assets/icon-06tX8z_E.css">
  </head>
  <body class="light-theme">
    <div id="app">
      <header class="top-bar">
        <div class="greeting" style="display: flex; align-items: center; gap: 1rem;">
          <md-icon-button onclick="window.location.href='./index.html'">
            <span class="material-symbols-outlined">arrow_back</span>
          </md-icon-button>
          <div>
            <h1>Learning Roadmap</h1>
            <p>Your educational journey</p>
          </div>
        </div>
      </header>

      <main class="dashboard-grid" style="grid-template-columns: 1fr; max-width: 800px; margin: 0 auto;">
        
        <div class="timeline" id="roadmap-timeline">
          <!-- Populated by JS -->
        </div>

      </main>
    </div>
  </body>
</html>
