<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NIDAN Library</title>
    <link rel="stylesheet" href="/src/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
    <style>
      .search-bar {
        background: var(--surface);
        border-radius: 24px;
        padding: 0 1rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex: 1;
        max-width: 400px;
        border: 1px solid var(--card-border);
      }
      .search-bar input {
        border: none;
        background: transparent;
        padding: 0.75rem 0;
        font-size: 1rem;
        flex: 1;
        outline: none;
        font-family: inherit;
      }
      .library-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 1.5rem;
        margin-top: 1.5rem;
      }
      .resource-card {
        background: var(--surface);
        border-radius: 12px;
        border: 1px solid var(--card-border);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      .resource-card:hover {
        transform: translateY(-4px);
        box-shadow: var(--card-shadow-hover);
      }
      .resource-preview {
        height: 120px;
        background: rgba(0,0,0,0.05);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-secondary);
      }
      .resource-preview .material-symbols-outlined {
        font-size: 4rem;
      }
      .resource-info {
        padding: 1rem;
        flex: 1;
      }
      .resource-title {
        font-size: 1.1rem;
        font-weight: 500;
        margin: 0 0 0.25rem 0;
      }
      .resource-meta {
        font-size: 0.9rem;
        color: var(--text-secondary);
        margin: 0;
      }
      .resource-actions {
        padding: 0.5rem;
        display: flex;
        justify-content: flex-end;
        gap: 0.5rem;
        border-top: 1px solid var(--card-border);
      }
      .bookmarked {
        color: #fbc02d; /* yellow */
      }
    </style>
  </head>
  <body class="light-theme">
    <div id="app">
      <header class="top-bar" style="justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 1rem;">
          <md-icon-button onclick="window.location.href='/'">
            <span class="material-symbols-outlined">arrow_back</span>
          </md-icon-button>
          <h1 style="font-size: 1.5rem; margin: 0;">Library</h1>
        </div>
        
        <div class="search-bar">
          <md-icon>search</md-icon>
          <input type="text" id="search-input" placeholder="Search installed resources..." disabled />
        </div>
      </header>

      <main style="padding: 1.5rem; max-width: 1200px; margin: 0 auto;">
        
        <p>Resources are installed by the school. This device currently has no approved library files.</p>

        <div class="library-grid" id="library-grid">
          <!-- Populated by JS -->
        </div>

      </main>
    </div>
    <script type="module" src="/src/library.ts"></script>
  </body>
</html>
