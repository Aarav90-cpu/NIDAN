<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NIDAN Progress</title>
    <link rel="stylesheet" href="/src/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
    <style>
      .progress-list {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }
      .progress-item {
        background: var(--surface);
        padding: 1.5rem;
        border-radius: 12px;
        border: 1px solid var(--card-border);
      }
      .progress-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.5rem;
      }
      .progress-title {
        font-size: 1.25rem;
        font-weight: 500;
        margin: 0;
      }
      .progress-stats {
        font-size: 1.1rem;
        font-weight: 500;
        color: var(--text-primary);
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
    </style>
  </head>
  <body class="light-theme">
    <div id="app">
      <header class="top-bar">
        <div class="greeting" style="display: flex; align-items: center; gap: 1rem;">
          <md-icon-button onclick="window.location.href='/'">
            <span class="material-symbols-outlined">arrow_back</span>
          </md-icon-button>
          <div>
            <h1>Your Progress</h1>
            <p>Marks recorded by your school</p>
          </div>
        </div>
      </header>

      <main class="dashboard-grid" style="grid-template-columns: 1fr; max-width: 800px; margin: 2rem auto;">
        <section class="card">
          <div class="card-header">
            <h2>Recorded Assessments</h2>
            <md-icon style="color: var(--primary);">trending_up</md-icon>
          </div>
          <div class="card-body progress-list" id="progress-list">
            <!-- Populated by JS -->
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/progress.ts"></script>
  </body>
</html>
